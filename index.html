<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>珍珍日上TV</title>
  <meta name="description" content="珍珍日上TV：黑金质感视频安利站，支持后台录入视频与站内弹层播放。">
  <style>
    :root {
      --bg: #060606;
      --bg-soft: #111111;
      --panel: #151515;
      --panel-2: #1c1c1c;
      --line: rgba(255, 217, 128, 0.2);
      --gold: #d6a347;
      --gold-2: #f2cd86;
      --text: #f7f3ea;
      --muted: #c9bc9f;
      --danger: #d96c6c;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 0%, rgba(214, 163, 71, 0.13), transparent 36%),
        radial-gradient(circle at 10% 18%, rgba(214, 163, 71, 0.09), transparent 28%),
        linear-gradient(180deg, #050505, #0d0d0d 45%, #050505);
      min-height: 100vh;
    }

    .container {
      width: min(1320px, 94vw);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(5, 5, 5, 0.88);
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 1.12rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
      font-weight: 700;
    }

    .brand b {
      color: var(--gold-2);
      margin-right: 4px;
    }

    .search {
      flex: 1;
      max-width: 520px;
      border: 1px solid rgba(255, 224, 160, 0.24);
      background: rgba(255, 227, 170, 0.06);
      border-radius: 999px;
      height: 40px;
      padding: 0 14px;
      display: flex;
      align-items: center;
    }

    .search input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 0.92rem;
    }

    .search input::placeholder {
      color: #b9ac90;
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 10px;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      text-decoration: none;
      color: #f2e7cf;
      border: 1px solid rgba(255, 219, 147, 0.25);
      background: rgba(255, 219, 147, 0.06);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.84rem;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: #2d220e;
      background: linear-gradient(120deg, var(--gold), var(--gold-2));
      border-color: transparent;
    }

    main {
      padding-bottom: 34px;
    }

    .hero {
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background:
        linear-gradient(120deg, rgba(24, 20, 12, 0.96) 20%, rgba(16, 16, 16, 0.75)),
        radial-gradient(circle at 68% 28%, rgba(214, 163, 71, 0.25), transparent 42%);
      position: relative;
      min-height: 300px;
    }

    .hero.with-image {
      background-size: cover;
      background-position: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 5, 5, 0.78), rgba(5, 5, 5, 0.28));
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: clamp(24px, 5vw, 54px);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .hero-tag {
      color: #f7d9a2;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3.8vw, 3rem);
      line-height: 1.25;
      color: #fff3d8;
    }

    .hero p {
      max-width: 620px;
      color: #e5d5b1;
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .hero-actions {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-actions a {
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.9rem;
      transition: 0.2s ease;
    }

    .hero-actions .primary {
      color: #22170a;
      background: linear-gradient(120deg, var(--gold), var(--gold-2));
      font-weight: 700;
    }

    .hero-actions .secondary {
      color: #f4e8d1;
      border: 1px solid rgba(255, 219, 147, 0.35);
      background: rgba(255, 219, 147, 0.08);
    }

    .hero-actions a:hover {
      transform: translateY(-1px);
    }

    .channel {
      margin-top: 28px;
    }

    .channel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      gap: 10px;
    }

    .channel-head h2 {
      font-size: 1.3rem;
      color: #f8ead0;
    }

    .channel-head a {
      font-size: 0.86rem;
      text-decoration: none;
      color: #e4c88f;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .video-card {
      border: 1px solid rgba(255, 219, 147, 0.19);
      background: linear-gradient(180deg, #1a1a1a, #121212);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s ease;
      min-width: 0;
    }

    .video-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 219, 147, 0.52);
    }

    .thumb {
      aspect-ratio: 16 / 9;
      position: relative;
      border-bottom: 1px solid rgba(255, 219, 147, 0.2);
      background:
        linear-gradient(135deg, rgba(214, 163, 71, 0.22), rgba(82, 62, 31, 0.35)),
        #161616;
      background-size: cover;
      background-position: center;
      display: grid;
      place-items: center;
    }

    .play {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 232, 186, 0.5);
      background: rgba(0, 0, 0, 0.35);
      color: #ffefcf;
      display: grid;
      place-items: center;
      font-size: 0.86rem;
    }

    .duration {
      position: absolute;
      right: 8px;
      bottom: 8px;
      border-radius: 6px;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #f8f1df;
      font-size: 0.72rem;
    }

    .info {
      padding: 10px 10px 12px;
    }

    .title {
      font-size: 0.9rem;
      line-height: 1.36;
      min-height: 2.45em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #f6ecd9;
    }

    .desc {
      margin-top: 5px;
      font-size: 0.79rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      grid-column: 1 / -1;
      border: 1px dashed rgba(255, 219, 147, 0.35);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      color: #ccb98f;
      background: rgba(255, 219, 147, 0.05);
      font-size: 0.9rem;
    }

    /* player modal */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 20px;
    }

    .player-modal.show {
      display: flex;
    }

    .player-dialog {
      width: min(1200px, 95vw);
      background: #0f0f0f;
      border: 1px solid rgba(255, 219, 147, 0.25);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 219, 147, 0.2);
      background: #141414;
    }

    .player-top b {
      color: #ffe7bc;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-close {
      border: 1px solid rgba(255, 219, 147, 0.35);
      border-radius: 8px;
      background: rgba(255, 219, 147, 0.08);
      color: #f7e5c1;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    .player-frame iframe,
    .player-frame video {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      color: #d8c59a;
      background:
        radial-gradient(circle at 60% 30%, rgba(214, 163, 71, 0.2), transparent 38%),
        #080808;
    }

    .player-footer {
      padding: 10px 14px 14px;
      border-top: 1px solid rgba(255, 219, 147, 0.16);
      background: #121212;
    }

    .player-footer p {
      font-size: 0.88rem;
      color: #d4c19a;
      line-height: 1.5;
    }

    .player-origin {
      margin-top: 8px;
      display: none;
      font-size: 0.82rem;
      color: #f0d39a;
      text-decoration: none;
    }

    .player-origin.show {
      display: inline-block;
    }

    /* admin modal */
    .admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .admin-modal.show {
      display: flex;
    }

    .admin-panel {
      width: min(1120px, 95vw);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid rgba(255, 219, 147, 0.25);
      border-radius: 14px;
      background: #101010;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .admin-head h2 {
      font-size: 1rem;
      color: #ffe6bd;
    }

    .admin-close {
      border: 1px solid rgba(255, 219, 147, 0.35);
      border-radius: 8px;
      background: rgba(255, 219, 147, 0.08);
      color: #f7e5c1;
      padding: 6px 10px;
      cursor: pointer;
    }

    .admin-alert {
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 219, 147, 0.28);
      background: rgba(255, 219, 147, 0.08);
      color: #ecd8b2;
      font-size: 0.84rem;
      padding: 10px 12px;
      line-height: 1.5;
    }

    .admin-alert.error {
      border-color: rgba(217, 108, 108, 0.6);
      background: rgba(217, 108, 108, 0.12);
      color: #ffd3d3;
    }

    .admin-alert.ok {
      border-color: rgba(119, 188, 128, 0.5);
      background: rgba(119, 188, 128, 0.12);
      color: #d2ffd8;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 10px;
    }

    .admin-form,
    .admin-list-wrap {
      border: 1px solid rgba(255, 219, 147, 0.2);
      border-radius: 10px;
      background: #161616;
      padding: 10px;
    }

    .admin-form h3,
    .admin-list-wrap h3 {
      font-size: 0.9rem;
      color: #ffe1ac;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 8px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: #d8c49b;
      margin-bottom: 4px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid rgba(255, 219, 147, 0.2);
      border-radius: 8px;
      background: #101010;
      color: #f6eddc;
      font-size: 0.84rem;
      padding: 8px 9px;
      outline: none;
    }

    .field textarea {
      min-height: 74px;
      resize: vertical;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      border: 1px solid rgba(255, 219, 147, 0.3);
      border-radius: 8px;
      background: rgba(255, 219, 147, 0.07);
      color: #f4e6c8;
      font-size: 0.82rem;
      padding: 7px 10px;
      cursor: pointer;
    }

    .btn.primary {
      color: #291c0d;
      background: linear-gradient(120deg, var(--gold), var(--gold-2));
      border-color: transparent;
      font-weight: 700;
    }

    .btn.danger {
      color: #ffd2d2;
      border-color: rgba(217, 108, 108, 0.58);
      background: rgba(217, 108, 108, 0.14);
    }

    .admin-list {
      display: grid;
      gap: 8px;
      max-height: 55vh;
      overflow: auto;
      padding-right: 2px;
    }

    .admin-item {
      border: 1px solid rgba(255, 219, 147, 0.18);
      border-radius: 9px;
      background: #111111;
      padding: 8px;
    }

    .admin-item-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
    }

    .admin-item-head b {
      color: #ffe7bd;
    }

    .admin-item-meta {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.73rem;
      color: #cbb98f;
    }

    .badge {
      border: 1px solid rgba(255, 219, 147, 0.42);
      border-radius: 999px;
      padding: 1px 6px;
      background: rgba(255, 219, 147, 0.12);
      color: #ffeac3;
    }

    .admin-item-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }

    footer {
      border-top: 1px solid var(--line);
      text-align: center;
      color: #a9966d;
      font-size: 0.83rem;
      padding: 20px 0 32px;
    }

    @media (max-width: 1200px) {
      .video-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .topbar {
        height: auto;
        padding: 12px 0;
        flex-wrap: wrap;
      }
      .search {
        order: 3;
        max-width: none;
        width: 100%;
      }
      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
      .split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <div class="brand"><b>珍珍日上TV</b></div>
      <label class="search">
        <input id="searchInput" type="text" placeholder="搜索视频标题/简介">
      </label>
      <nav class="nav">
        <a href="#stage" class="active">舞台</a>
        <a href="#show">综艺</a>
        <a href="#role">角色</a>
        <a href="#live">直播回放</a>
        <a href="#" id="adminEntry">管理入口</a>
        <a href="/daily-group.html">官群空降</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero" id="heroBanner">
      <div class="hero-inner">
        <div class="hero-tag">Zhenzhen Rising TV</div>
        <h1>珍珍日上TV</h1>
        <p>黑金质感安利首页，按频道浏览，一键打开弹层播放器观看。</p>
        <div class="hero-actions">
          <a class="primary" href="#stage">开始浏览</a>
          <a class="secondary" href="/daily-group.html">官群空降图鉴</a>
        </div>
      </div>
    </section>

    <section class="channel" id="stage">
      <div class="channel-head">
        <h2>舞台安利</h2>
        <a href="#">更多 ></a>
      </div>
      <div class="video-grid" data-channel="stage"></div>
    </section>

    <section class="channel" id="show">
      <div class="channel-head">
        <h2>综艺安利</h2>
        <a href="#">更多 ></a>
      </div>
      <div class="video-grid" data-channel="show"></div>
    </section>

    <section class="channel" id="role">
      <div class="channel-head">
        <h2>角色安利</h2>
        <a href="#">更多 ></a>
      </div>
      <div class="video-grid" data-channel="role"></div>
    </section>

    <section class="channel" id="live">
      <div class="channel-head">
        <h2>直播回放</h2>
        <a href="#">更多 ></a>
      </div>
      <div class="video-grid" data-channel="live"></div>
    </section>
  </main>

  <div id="playerModal" class="player-modal" aria-hidden="true">
    <div class="player-dialog">
      <div class="player-top">
        <b id="playerTitle">未选择视频</b>
        <button id="playerClose" class="player-close" type="button">关闭播放器</button>
      </div>
      <div class="player-frame">
        <iframe id="siteFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        <video id="siteVideo" controls playsinline></video>
        <div id="playerPlaceholder" class="player-placeholder">
          <div>
            <h3 style="margin-bottom:8px;">当前视频暂不支持站内播放</h3>
            <p style="font-size:0.88rem;line-height:1.5;">可点击下方“打开原链接”在新窗口观看。</p>
          </div>
        </div>
      </div>
      <div class="player-footer">
        <p id="playerDesc">-</p>
        <a id="playerOrigin" class="player-origin" href="#" target="_blank" rel="noopener noreferrer">打开原链接</a>
      </div>
    </div>
  </div>

  <div id="adminModal" class="admin-modal" aria-hidden="true">
    <div class="admin-panel">
      <div class="admin-head">
        <h2>管理后台</h2>
        <button id="adminClose" class="admin-close" type="button">关闭</button>
      </div>
      <div id="adminAlert" class="admin-alert">后台已就绪。</div>

      <div class="admin-alert" style="margin-top:8px;">
        <div class="split">
          <div class="field">
            <label for="heroImageUrl">首页横幅图片链接</label>
            <input id="heroImageUrl" type="url" placeholder="https://...">
          </div>
          <div class="field">
            <label for="heroImageOn">横幅图片开关</label>
            <select id="heroImageOn">
              <option value="on">启用</option>
              <option value="off">关闭</option>
            </select>
          </div>
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button id="saveHeroBtn" class="btn" type="button">保存横幅设置</button>
        </div>
      </div>

      <div class="admin-alert" style="margin-top:8px;">
        <div class="split">
          <div class="field">
            <label for="ghOwner">GitHub Owner</label>
            <input id="ghOwner" type="text" placeholder="例如：glow0505">
          </div>
          <div class="field">
            <label for="ghRepo">GitHub Repo</label>
            <input id="ghRepo" type="text" placeholder="例如：glow0505.github.io">
          </div>
          <div class="field">
            <label for="ghBranch">分支</label>
            <input id="ghBranch" type="text" placeholder="main">
          </div>
          <div class="field">
            <label for="ghPath">云端数据文件路径</label>
            <input id="ghPath" type="text" placeholder="data/zzrs-videos.json">
          </div>
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="ghToken">GitHub Token（contents 写权限）</label>
          <input id="ghToken" type="password" placeholder="ghp_xxx">
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button id="saveCloudConfigBtn" class="btn" type="button">保存云配置</button>
          <button id="pullCloudBtn" class="btn" type="button">从云端拉取</button>
          <button id="pushCloudBtn" class="btn" type="button">上传到云端</button>
          <label style="margin-left:auto;font-size:.8rem;display:flex;align-items:center;gap:6px;color:#e3e9ff;">
            <input id="autoSyncCloud" type="checkbox">
            自动云同步
          </label>
        </div>
      </div>

      <div class="admin-grid">
        <section class="admin-form">
          <h3 id="formTitle">新增视频</h3>
          <form id="adminForm">
            <input type="hidden" id="editId">
            <div class="field">
              <label for="videoTitle">视频标题 *</label>
              <input id="videoTitle" type="text" required>
            </div>
            <div class="field">
              <label for="videoDesc">视频简介</label>
              <textarea id="videoDesc"></textarea>
            </div>
            <div class="split">
              <div class="field">
                <label for="videoDuration">时长</label>
                <input id="videoDuration" type="text" placeholder="例如：04:12">

                <label for="videoPlayUrl">playUrl（可选）</label>
                <input id="videoPlayUrl" type="url" placeholder="https://player.bilibili.com/player.html?...">
              </div>

                <label for="videoPlayType">播放类型（可选）</label>
                <select id="videoPlayType">

  <footer>
    <div class="container">珍珍日上TV</div>
  </footer>

  <script>
    const VIDEO_LIBRARY = {
      stage: [],
      show: [],
      role: [],
      live: []
    };

    const channelLabels = {
      stage: "舞台安利",
      show: "综艺安利",
      role: "角色安利",
      live: "直播回放"
    };
    const channelOrder = ["stage", "show", "role", "live"];

    const ADMIN_PASSWORD_KEY = "zzrs-admin-password";
    const DEFAULT_ADMIN_PASSWORD = "zzrs2026";
    const CLOUD_CONFIG_KEY = "zzrs-cloud-config";
    const CLOUD_TOKEN_KEY = "zzrs-cloud-token";
    const HERO_CONFIG_KEY = "zzrs-hero-config";

    const DB_NAME = "zzrs-media-db";
    const DB_VERSION = 1;
    const STORE_NAME = "videos";
    let dbPromise = null;

    let adminAuthed = false;
    let uploadedRecords = [];
    let uploadedByChannel = { stage: [], show: [], role: [], live: [] };
    let renderedMap = { stage: [], show: [], role: [], live: [] };

    const searchInput = document.getElementById("searchInput");
    const heroBanner = document.getElementById("heroBanner");

    const playerModal = document.getElementById("playerModal");
    const playerClose = document.getElementById("playerClose");
    const playerTitle = document.getElementById("playerTitle");
    const playerDesc = document.getElementById("playerDesc");
    const playerOrigin = document.getElementById("playerOrigin");
    const siteFrame = document.getElementById("siteFrame");
    const siteVideo = document.getElementById("siteVideo");
    const playerPlaceholder = document.getElementById("playerPlaceholder");

    const adminModal = document.getElementById("adminModal");
    const adminEntry = document.getElementById("adminEntry");
    const adminClose = document.getElementById("adminClose");
    const adminAlert = document.getElementById("adminAlert");
    const adminForm = document.getElementById("adminForm");
    const adminList = document.getElementById("adminList");
    const formTitle = document.getElementById("formTitle");
    const resetFormBtn = document.getElementById("resetFormBtn");

    const editId = document.getElementById("editId");
    const videoTitle = document.getElementById("videoTitle");
    const videoDesc = document.getElementById("videoDesc");
    const videoDuration = document.getElementById("videoDuration");
    const videoChannel = document.getElementById("videoChannel");
    const videoSourceUrl = document.getElementById("videoSourceUrl");
    const videoPlayUrl = document.getElementById("videoPlayUrl");
    const videoPlayType = document.getElementById("videoPlayType");
    const coverUrl = document.getElementById("coverUrl");

    const heroImageUrl = document.getElementById("heroImageUrl");
    const heroImageOn = document.getElementById("heroImageOn");
    const saveHeroBtn = document.getElementById("saveHeroBtn");

    const ghOwner = document.getElementById("ghOwner");
    const ghRepo = document.getElementById("ghRepo");
    const ghBranch = document.getElementById("ghBranch");
    const ghPath = document.getElementById("ghPath");
    const ghToken = document.getElementById("ghToken");
    const autoSyncCloud = document.getElementById("autoSyncCloud");
    const saveCloudConfigBtn = document.getElementById("saveCloudConfigBtn");
    const pullCloudBtn = document.getElementById("pullCloudBtn");
    const pushCloudBtn = document.getElementById("pushCloudBtn");

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function safeText(v, fallback) {
      return v && String(v).trim() ? String(v).trim() : fallback;
    }

    function showAlert(message, type) {
      adminAlert.textContent = message;
      adminAlert.classList.remove("error", "ok");
      if (type === "error") adminAlert.classList.add("error");
      if (type === "ok") adminAlert.classList.add("ok");
    }

    function openDB() {
      if (!("indexedDB" in window)) return Promise.reject(new Error("浏览器不支持 IndexedDB"));
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
      });
      return dbPromise;
    }

    async function dbGetAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function dbPut(record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const req = tx.objectStore(STORE_NAME).put(record);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(record);
      });
    }

    async function dbDelete(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const req = tx.objectStore(STORE_NAME).delete(id);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(true);
      });
    }

    async function dbReplaceAll(records) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const clearReq = store.clear();
        clearReq.onerror = () => reject(clearReq.error);
        clearReq.onsuccess = () => {
          records.forEach((r) => store.put(r));
        };
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error("写入失败"));
      });
    }

    function utf8ToBase64(input) {
      return btoa(unescape(encodeURIComponent(input)));
    }

    function base64ToUtf8(input) {
      return decodeURIComponent(escape(atob(input)));
    }

    function normalizeRepoPath(path) {
      return (path || "data/zzrs-videos.json").trim().replace(/^\/+/, "");
    }

    function encodeRepoPath(path) {
      return normalizeRepoPath(path).split("/").map(encodeURIComponent).join("/");
    }

    function sanitizeCloudRecord(record) {
      return {
        id: safeText(record.id, "video_" + Date.now().toString(36)),
        title: safeText(record.title, "未命名视频"),
        desc: safeText(record.desc, ""),
        duration: safeText(record.duration, ""),
        channel: channelOrder.includes(record.channel) ? record.channel : "stage",
        url: safeText(record.url, "#"),
        playUrl: safeText(record.playUrl, ""),
        playType: safeText(record.playType, ""),
        cover: safeText(record.cover, ""),
        createdAt: Number(record.createdAt) || Date.now(),
        updatedAt: Number(record.updatedAt) || Date.now()
      };
    }

    function loadCloudConfigToForm() {
      const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
      let saved = {};
      try { saved = raw ? JSON.parse(raw) : {}; } catch { saved = {}; }
      ghOwner.value = safeText(saved.owner, "glow0505");
      ghRepo.value = safeText(saved.repo, "glow0505.github.io");
      ghBranch.value = safeText(saved.branch, "main");
      ghPath.value = safeText(saved.path, "data/zzrs-videos.json");
      autoSyncCloud.checked = Boolean(saved.autoSync);
      ghToken.value = localStorage.getItem(CLOUD_TOKEN_KEY) || "";
    }

    function getCloudConfigFromForm() {
      return {
        owner: ghOwner.value.trim(),
        repo: ghRepo.value.trim(),
        branch: ghBranch.value.trim() || "main",
        path: normalizeRepoPath(ghPath.value),
        token: ghToken.value.trim(),
        autoSync: autoSyncCloud.checked
      };
    }

    function saveCloudConfigFromForm() {
      const cfg = getCloudConfigFromForm();
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify({
        owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, path: cfg.path, autoSync: cfg.autoSync
      }));
      if (cfg.token) localStorage.setItem(CLOUD_TOKEN_KEY, cfg.token);
      showAlert("云配置已保存。", "ok");
    }

    async function fetchCloudFileMeta(config) {
      const endpoint = `https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${encodeRepoPath(config.path)}?ref=${encodeURIComponent(config.branch)}`;
      const response = await fetch(endpoint, {
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${config.token}`
        }
      });
      if (response.status === 404) return { exists: false, sha: "" };
      if (!response.ok) throw new Error(`读取云端失败：HTTP ${response.status}`);
      const data = await response.json();
      return { exists: true, sha: data.sha || "", data };
    }

    async function pullFromCloud() {
      const cfg = getCloudConfigFromForm();
      if (!cfg.owner || !cfg.repo || !cfg.token) throw new Error("请先填写 GitHub owner/repo/token");
      const meta = await fetchCloudFileMeta(cfg);
      if (!meta.exists) throw new Error("云端数据文件不存在");
      const b64 = meta.data && meta.data.content ? String(meta.data.content).replace(/\n/g, "") : "";
      const text = base64ToUtf8(b64 || "");
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error("云端数据格式错误");
      const list = parsed.map(sanitizeCloudRecord);
      await dbReplaceAll(list);
      await refreshUploadedLibrary();
      return list.length;
    }

    async function pushToCloud() {
      const cfg = getCloudConfigFromForm();
      if (!cfg.owner || !cfg.repo || !cfg.token) throw new Error("请先填写 GitHub owner/repo/token");
      const meta = await fetchCloudFileMeta(cfg);
      const endpoint = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeRepoPath(cfg.path)}`;
      const payload = {
        message: `update zzrs videos ${new Date().toISOString()}`,
        content: utf8ToBase64(JSON.stringify(uploadedRecords.map(sanitizeCloudRecord), null, 2)),
        branch: cfg.branch
      };
      if (meta.exists && meta.sha) payload.sha = meta.sha;
      const response = await fetch(endpoint, {
        method: "PUT",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${cfg.token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`上传云端失败：HTTP ${response.status}`);
      return true;
    }

    function extractBvidFromText(text) {
      const match = String(text || "").match(/BV[0-9A-Za-z]{10}/i);
      if (!match) return "";
      return match[0].replace(/^bv/, "BV");
    }

    async function resolveB23ToBvid(shortUrl) {
      const direct = extractBvidFromText(shortUrl);
      if (direct) return direct;
      const normalized = String(shortUrl || "").trim().replace(/^https?:\/\//, "");
      if (!normalized) return "";
      const proxyUrl = `https://r.jina.ai/http://${normalized}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) return "";
      const text = await response.text();
      const full = text.match(/https?:\/\/www\.bilibili\.com\/video\/(BV[0-9A-Za-z]{10})/i);
      if (full && full[1]) return full[1];
      return extractBvidFromText(text);
    }

    function detectSourceFromUrl(rawUrl) {
      const url = (rawUrl || "").trim();
      if (!url || url === "#") return null;
      const lower = url.toLowerCase();

      if (url.includes("b23.tv/")) {
        const bvid = extractBvidFromText(url);
        if (bvid) return { type: "iframe", src: "https://player.bilibili.com/player.html?bvid=" + bvid + "&page=1" };
      }

      if (lower.endsWith(".mp4") || lower.endsWith(".webm") || lower.endsWith(".ogg")) {
        return { type: "video", src: url };
      }

      if (url.includes("bilibili.com/video/")) {
        const match = url.match(/\/video\/(BV[0-9A-Za-z]+)/);
        if (match && match[1]) return { type: "iframe", src: "https://player.bilibili.com/player.html?bvid=" + match[1] + "&page=1" };
      }

      if (url.includes("youtube.com/watch?v=")) {
        try {
          const v = new URL(url).searchParams.get("v");
          if (v) return { type: "iframe", src: "https://www.youtube.com/embed/" + v };
        } catch {}
      }
      if (url.includes("youtu.be/")) {
        const id = url.split("youtu.be/")[1].split("?")[0];
        if (id) return { type: "iframe", src: "https://www.youtube.com/embed/" + id };
      }

      if (url.includes("player.bilibili.com") || url.includes("player.youku.com") || url.includes("youtube.com/embed/") || url.includes("v.qq.com/txp/iframe/player.html")) {
        return { type: "iframe", src: url };
      }

      return null;
    }

    function getPlayableSource(item) {
      const type = (item.playType || "").trim();
      const playUrl = (item.playUrl || "").trim();
      if (playUrl) {
        if (type === "video" || type === "iframe") return { type, src: playUrl };
        return detectSourceFromUrl(playUrl);
      }
      return detectSourceFromUrl(item.url || "");
    }

    function buildCard(channel, item, idx) {
      const bg = item.cover && item.cover.trim()
        ? ` style="background-image: linear-gradient(135deg, rgba(214,163,71,0.22), rgba(82,62,31,0.35)), url('${escapeHTML(item.cover)}');"`
        : "";
      return `
        <article class="video-card" data-channel="${channel}" data-index="${idx}">
          <div class="thumb"${bg}>
            <div class="play">▶</div>
            <span class="duration">${escapeHTML(item.duration || "00:00")}</span>
          </div>
          <div class="info">
            <div class="title">${escapeHTML(item.title || "未命名视频")}</div>
            <div class="desc">${escapeHTML(item.desc || "暂无简介")}</div>
          </div>
        </article>
      `;
    }

    function getChannelItems(channel) {
      const uploaded = uploadedByChannel[channel] || [];
      const defaults = VIDEO_LIBRARY[channel] || [];
      return [...uploaded, ...defaults];
    }

    function renderAll() {
      const keyword = (searchInput.value || "").trim().toLowerCase();
      channelOrder.forEach((channel) => {
        const mount = document.querySelector(`.video-grid[data-channel="${channel}"]`);
        if (!mount) return;
        const source = getChannelItems(channel);
        const filtered = source.filter((item) => {
          if (!keyword) return true;
          const text = `${item.title || ""} ${item.desc || ""}`.toLowerCase();
          return text.includes(keyword);
        });
        renderedMap[channel] = filtered;
        if (!filtered.length) {
          mount.innerHTML = '<div class="empty">暂无内容，请先在后台上传。</div>';
          return;
        }
        mount.innerHTML = filtered.map((item, i) => buildCard(channel, item, i)).join("");
      });
    }

    function stopPlayer() {
      siteFrame.src = "";
      siteFrame.style.display = "none";
      siteVideo.pause();
      siteVideo.removeAttribute("src");
      siteVideo.load();
      siteVideo.style.display = "none";
    }

    function openPlayer(item) {
      const playable = getPlayableSource(item);
      playerTitle.textContent = safeText(item.title, "未命名视频");
      playerDesc.textContent = safeText(item.desc, "暂无简介");
      const rawUrl = safeText(item.url, "");
      if (rawUrl && rawUrl !== "#") {
        playerOrigin.href = rawUrl;
        playerOrigin.classList.add("show");
      } else {
        playerOrigin.classList.remove("show");
      }
      stopPlayer();
      if (!playable) {
        playerPlaceholder.style.display = "grid";
      } else {
        playerPlaceholder.style.display = "none";
        if (playable.type === "video") {
          siteVideo.src = playable.src;
          siteVideo.style.display = "block";
          siteVideo.play().catch(() => {});
        } else {
          siteFrame.src = playable.src;
          siteFrame.style.display = "block";
        }
      }
      playerModal.classList.add("show");
      playerModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      playerModal.classList.remove("show");
      playerModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      stopPlayer();
    }

    function makeUploadedItem(record) {
      return {
        id: record.id,
        title: safeText(record.title, "未命名视频"),
        desc: safeText(record.desc, ""),
        duration: safeText(record.duration, "00:00"),
        channel: channelOrder.includes(record.channel) ? record.channel : "stage",
        url: safeText(record.url, "#"),
        playUrl: safeText(record.playUrl, ""),
        playType: safeText(record.playType, ""),
        cover: safeText(record.cover, ""),
        updatedAt: Number(record.updatedAt) || Date.now(),
        createdAt: Number(record.createdAt) || Date.now(),
        fromAdmin: true
      };
    }

    async function refreshUploadedLibrary() {
      try {
        const records = await dbGetAll();
        uploadedRecords = records.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        uploadedByChannel = { stage: [], show: [], role: [], live: [] };
        uploadedRecords.forEach((record) => {
          const channel = channelOrder.includes(record.channel) ? record.channel : "stage";
          uploadedByChannel[channel].push(makeUploadedItem(record));
        });
      } catch (error) {
        showAlert("读取后台数据失败：" + error.message, "error");
      }
      renderAll();
      renderAdminList();
    }

    function renderAdminList() {
      if (!uploadedRecords.length) {
        adminList.innerHTML = '<div class="empty">暂无内容。</div>';
        return;
      }
      adminList.innerHTML = uploadedRecords.map((record) => {
        const ch = channelLabels[record.channel] || "舞台安利";
        const playInfo = safeText(record.playUrl, "") ? "站内可播" : "仅跳转";
        const time = record.updatedAt ? new Date(record.updatedAt).toLocaleString() : "-";
        return `
          <article class="admin-item">
            <div class="admin-item-head">
              <b>${escapeHTML(record.title || "未命名视频")}</b>
              <span>${escapeHTML(record.duration || "--:--")}</span>
            </div>
            <div class="admin-item-meta">
              <span class="badge">${escapeHTML(ch)}</span>
              <span>${escapeHTML(playInfo)}</span>
              <span>${escapeHTML(time)}</span>
            </div>
            <div class="admin-item-actions">
              <button class="btn" type="button" data-action="edit" data-id="${escapeHTML(record.id)}">编辑</button>
              <button class="btn danger" type="button" data-action="delete" data-id="${escapeHTML(record.id)}">删除</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function resetAdminForm() {
      adminForm.reset();
      editId.value = "";
      formTitle.textContent = "新增视频";
    }

    function fillAdminForm(record) {
      editId.value = record.id;
      videoTitle.value = record.title || "";
      videoDesc.value = record.desc || "";
      videoDuration.value = record.duration || "";
      videoChannel.value = channelOrder.includes(record.channel) ? record.channel : "stage";
      videoSourceUrl.value = record.url && record.url !== "#" ? record.url : "";
      videoPlayUrl.value = record.playUrl || "";
      videoPlayType.value = record.playType || "";
      coverUrl.value = record.cover || "";
      formTitle.textContent = "编辑视频";
      showAlert("正在编辑。", "ok");
    }

    function loadHeroConfig() {
      let cfg = {};
      try {
        cfg = JSON.parse(localStorage.getItem(HERO_CONFIG_KEY) || "{}");
      } catch {
        cfg = {};
      }
      heroImageUrl.value = cfg.url || "";
      heroImageOn.value = cfg.enabled === false ? "off" : "on";
      applyHeroConfig(cfg);
    }

    function applyHeroConfig(cfg) {
      const enabled = cfg && cfg.enabled !== false;
      const url = safeText(cfg && cfg.url, "");
      if (enabled && url) {
        heroBanner.classList.add("with-image");
        heroBanner.style.backgroundImage = `linear-gradient(120deg, rgba(24,20,12,0.92) 20%, rgba(16,16,16,0.52)), url('${url}')`;
      } else {
        heroBanner.classList.remove("with-image");
        heroBanner.style.backgroundImage = "";
      }
    }

    async function saveHeroConfig() {
      const cfg = {
        enabled: heroImageOn.value !== "off",
        url: heroImageUrl.value.trim()
      };
      localStorage.setItem(HERO_CONFIG_KEY, JSON.stringify(cfg));
      applyHeroConfig(cfg);
      if (autoSyncCloud.checked) {
        try { await pushToCloud(); } catch {}
      }
      showAlert("横幅设置已保存。", "ok");
    }

    function getAdminPassword() {
      return localStorage.getItem(ADMIN_PASSWORD_KEY) || DEFAULT_ADMIN_PASSWORD;
    }

    function openAdmin() {
      if (!adminAuthed) {
        const input = window.prompt("请输入管理后台密码");
        if (input === null) return;
        if (input !== getAdminPassword()) {
          window.alert("密码错误");
          return;
        }
        adminAuthed = true;
      }
      adminModal.classList.add("show");
      adminModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      loadCloudConfigToForm();
      showAlert("管理后台已打开。");
      renderAdminList();
    }

    function closeAdmin() {
      adminModal.classList.remove("show");
      adminModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      resetAdminForm();
    }

    function bindMainEvents() {
      document.addEventListener("click", (event) => {
        const card = event.target.closest(".video-card");
        if (!card) return;
        const channel = card.dataset.channel;
        const idx = Number(card.dataset.index);
        if (!channel || Number.isNaN(idx)) return;
        const item = (renderedMap[channel] || [])[idx];
        if (!item) return;
        openPlayer(item);
      });

      playerClose.addEventListener("click", closePlayer);
      playerModal.addEventListener("click", (e) => {
        if (e.target === playerModal) closePlayer();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && playerModal.classList.contains("show")) closePlayer();
      });

      adminEntry.addEventListener("click", (e) => {
        e.preventDefault();
        openAdmin();
      });
      adminClose.addEventListener("click", closeAdmin);
      adminModal.addEventListener("click", (e) => {
        if (e.target === adminModal) closeAdmin();
      });

      resetFormBtn.addEventListener("click", () => {
        resetAdminForm();
        showAlert("表单已清空。");
      });
      saveHeroBtn.addEventListener("click", saveHeroConfig);

      saveCloudConfigBtn.addEventListener("click", () => {
        saveCloudConfigFromForm();
      });

      pullCloudBtn.addEventListener("click", async () => {
        try {
          const count = await pullFromCloud();
          showAlert(`已从云端拉取 ${count} 条。`, "ok");
        } catch (error) {
          showAlert(error.message, "error");
        }
      });

      pushCloudBtn.addEventListener("click", async () => {
        try {
          await pushToCloud();
          showAlert("已上传到云端。", "ok");
        } catch (error) {
          showAlert(error.message, "error");
        }
      });

      adminForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = editId.value || "video_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const existing = uploadedRecords.find((x) => x.id === id);
        const channel = videoChannel.value;
        const title = videoTitle.value.trim();
        if (!title) return showAlert("请填写视频标题。", "error");
        if (!channelOrder.includes(channel)) return showAlert("分区无效。", "error");

        const sourceUrl = videoSourceUrl.value.trim();
        let playUrl = videoPlayUrl.value.trim();

        if (!playUrl && sourceUrl) {
          const autoPlayable = detectSourceFromUrl(sourceUrl);
          if (autoPlayable && autoPlayable.type === "iframe") {
            playUrl = autoPlayable.src;
          }
        }

        if (!playUrl && sourceUrl && sourceUrl.includes("b23.tv/")) {
          showAlert("正在解析 b23 短链...", "ok");
          try {
            const bvid = await resolveB23ToBvid(sourceUrl);
            if (bvid) {
              playUrl = `https://player.bilibili.com/player.html?bvid=${bvid}&page=1`;
              videoPlayUrl.value = playUrl;
            }
          } catch {}
        }

        if (!playUrl && !sourceUrl) {
          return showAlert("请至少填写一种链接。", "error");
        }

        const record = {
          id,
          title,
          desc: videoDesc.value.trim(),
          duration: videoDuration.value.trim(),
          channel,
          url: sourceUrl || "#",
          playUrl,
          playType: videoPlayType.value.trim(),
          cover: coverUrl.value.trim(),
          createdAt: existing ? existing.createdAt : Date.now(),
          updatedAt: Date.now()
        };

        try {
          await dbPut(record);
          await refreshUploadedLibrary();
          if (autoSyncCloud.checked) {
            await pushToCloud();
          }
          resetAdminForm();
          showAlert("保存成功。", "ok");
        } catch (error) {
          showAlert("保存失败：" + error.message, "error");
        }
      });

      adminList.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        const record = uploadedRecords.find((x) => x.id === id);
        if (!record) return;
        if (action === "edit") {
          fillAdminForm(record);
          return;
        }
        if (action === "delete") {
          if (!window.confirm("确定删除该视频？")) return;
          try {
            await dbDelete(id);
            await refreshUploadedLibrary();
            if (autoSyncCloud.checked) await pushToCloud();
            showAlert("删除成功。", "ok");
          } catch (error) {
            showAlert("删除失败：" + error.message, "error");
          }
        }
      });
    }

    const navLinks = document.querySelectorAll(".nav a[href^='#']");
    const sections = document.querySelectorAll(".channel");
    function updateNavActive() {
      let current = "stage";
      sections.forEach((section) => {
        if (window.scrollY >= section.offsetTop - 130) current = section.id;
      });
      navLinks.forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === "#" + current);
      });
    }

    searchInput.addEventListener("input", renderAll);
    window.addEventListener("scroll", updateNavActive);

    loadHeroConfig();
    loadCloudConfigToForm();
    renderAll();
    bindMainEvents();
    updateNavActive();
    refreshUploadedLibrary();
  </script>
</body>
</html>
